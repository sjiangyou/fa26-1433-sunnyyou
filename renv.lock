    "dreamerr": {
      "Package": "dreamerr",
      "Version": "1.5.0",
      "Source": "Repository",
      "Type": "Package",
      "Title": "Error Handling Made Easy",
      "Authors@R": "person(\"Laurent\", \"Berge\", email = \"laurent.berge@u-bordeaux.fr\", role = c(\"aut\", \"cre\"))",
      "Imports": [
